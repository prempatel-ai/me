<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glowAP" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a3ffc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bgAP)" rx="12"/>
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <path d="M0 40 H400 M0 80 H400 M0 120 H400 M0 160 H400 M0 200 H400" />
    <path d="M40 0 V240 M80 0 V240 M120 0 V240 M160 0 V240 M200 0 V240 M240 0 V240 M280 0 V240 M320 0 V240 M360 0 V240" />
  </g>
  <!-- Node 1: AI Agent -->
  <rect x="30" y="80" width="85" height="80" rx="10" fill="#1e293b" stroke="#8a3ffc" stroke-width="2"/>
  <text x="72" y="115" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">LLM Agent</text>
  <text x="72" y="135" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Proposes Buy</text>
  <!-- Arrow to Guardrail -->
  <path d="M 115 120 L 155 120" stroke="#8a3ffc" stroke-width="2.5" stroke-dasharray="4 2"/>
  <polygon points="155,116 163,120 155,124" fill="#8a3ffc" />
  <!-- Node 2: Policy Engine (Guardrail) -->
  <rect x="165" y="70" width="100" height="100" rx="10" fill="#111827" stroke="#10b981" stroke-width="2.5"/>
  <circle cx="215" cy="98" r="14" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <path d="M211 98 L214 102 L220 94" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <text x="215" y="125" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">Deterministic</text>
  <text x="215" y="140" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#6ee7b7" text-anchor="middle">Policy Gate</text>
  <text x="215" y="156" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#94a3b8" text-anchor="middle">Audit Trigger</text>
  <!-- Arrow to Payment -->
  <path d="M 265 120 L 305 120" stroke="#10b981" stroke-width="2.5" />
  <polygon points="305,116 313,120 305,124" fill="#10b981" />
  <!-- Node 3: Razorpay API -->
  <rect x="315" y="80" width="65" height="80" rx="10" fill="#1e293b" stroke="#0284c7" stroke-width="2"/>
  <text x="347" y="115" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">Razorpay</text>
  <text x="347" y="135" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Execution</text>
  <!-- Status Badge at top -->
  <rect x="25" y="20" width="170" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="110" y="37" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#e2e8f0" text-anchor="middle">⚡ Agent Commerce Core</text>
</svg>
